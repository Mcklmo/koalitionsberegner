[project]
name = "koalitionsberegner-backend"
version = "1.0.0"
description = "Shared election store with identity hashing and single-flight parsing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "google-cloud-firestore>=2.19",
    "anyio>=4.4",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "trio>=0.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
