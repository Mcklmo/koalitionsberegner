[project]
name = "koalitionsberegner-backend"
version = "1.0.0"
description = "Shared election store with identity hashing and single-flight parsing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
    "google-cloud-firestore>=2.19",
    "anyio>=4.4",
    "httpx>=0.27",
    "anthropic>=0.40",
    "stripe>=15.0",   # the v1 client namespace billing.py builds on
]

# Test-only dependencies. A dependency group rather than an optional extra:
# nobody installing this service wants them, and `uv sync` brings them in for
# development without them ever being part of what ships.
[dependency-groups]
dev = ["pytest>=8.3", "trio>=0.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
