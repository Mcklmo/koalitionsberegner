<!DOCTYPE html>
<html lang="da">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koalitionsberegner</title>
  <!-- Same-origin by default; set a URL here to point at a separately hosted API. -->
  <meta name="api-base" content="">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
      color: #111;
      padding: 1.5rem;
      max-width: 580px;
      margin: 0 auto
    }

    @media(prefers-color-scheme:dark) {
      body {
        background: #1a1a1a;
        color: #eee
      }
    }

    h2 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 4px
    }

    .sub {
      font-size: 13px;
      color: #666;
      margin-bottom: 1.25rem
    }

    @media(prefers-color-scheme:dark) {
      .sub {
        color: #aaa
      }
    }

    .blok-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #aaa;
      margin: 1rem 0 6px;
      padding-left: 2px
    }

    .party-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s;
      border: 0.5px solid transparent;
      margin-bottom: 4px;
      user-select: none
    }

    .party-row:hover {
      background: #f3f3f3
    }

    .party-row.selected {
      background: #f3f3f3;
      border-color: #ccc
    }

    @media(prefers-color-scheme:dark) {

      .party-row:hover,
      .party-row.selected {
        background: #2a2a2a;
        border-color: #444
      }
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .party-name {
      flex: 1;
      font-size: 14px
    }

    .abbr {
      font-size: 11px;
      color: #aaa;
      font-weight: 500;
      width: 32px
    }

    .seats {
      font-size: 14px;
      font-weight: 500;
      width: 28px;
      text-align: right
    }

    .check {
      width: 16px;
      height: 16px;
      border: 0.5px solid #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .12s
    }

    .check.on {
      background: #378ADD;
      border-color: #378ADD
    }

    .check.on::after {
      content: '';
      display: block;
      width: 5px;
      height: 8px;
      border: 1.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(40deg) translateY(-1px)
    }

    .sticky-bar {
      position: sticky;
      bottom: 0;
      padding: 1rem 0 0.5rem;
      background: #fff;
      border-top: 0.5px solid #e0e0e0;
      margin-top: 1rem
    }

    @media(prefers-color-scheme:dark) {
      .sticky-bar {
        background: #1a1a1a;
        border-color: #333
      }
    }

    .progress-track {
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px
    }

    @media(prefers-color-scheme:dark) {
      .progress-track {
        background: #333
      }
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .2s, background .2s
    }

    .stats {
      display: flex;
      align-items: baseline;
      gap: 8px
    }

    .total-num {
      font-size: 28px;
      font-weight: 500
    }

    .total-of {
      font-size: 14px;
      color: #666
    }

    @media(prefers-color-scheme:dark) {
      .total-of {
        color: #aaa
      }
    }

    .verdict {
      font-size: 13px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      margin-left: auto
    }

    .v-no {
      background: #f0f0f0;
      color: #666
    }

    .v-yes {
      background: #E6F1FB;
      color: #185FA5
    }

    .v-over {
      background: #EAF3DE;
      color: #3B6D11
    }

    .reset-btn {
      font-size: 12px;
      color: #aaa;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 0;
      text-decoration: underline
    }

    .reset-btn:hover {
      color: #111
    }

    .footer-note {
      font-size: 11px;
      color: #aaa
    }

    .picker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem
    }

    .picker-row label {
      font-size: 12px;
      color: #888
    }

    select,
    input {
      font: inherit;
      font-size: 13px;
      padding: 6px 8px;
      border: 0.5px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: inherit;
      width: 100%
    }

    @media(prefers-color-scheme:dark) {

      select,
      input {
        background: #222;
        border-color: #444
      }
    }

    details.import {
      margin-top: 1.5rem;
      border-top: 0.5px solid #e0e0e0;
      padding-top: 1rem
    }

    @media(prefers-color-scheme:dark) {
      details.import {
        border-color: #333
      }
    }

    details.import summary {
      font-size: 13px;
      color: #888;
      cursor: pointer;
      user-select: none
    }

    .field {
      margin-top: 10px
    }

    .field label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 3px
    }

    .field-error {
      font-size: 11px;
      color: #C0392B;
      margin-top: 3px;
      min-height: 13px
    }

    .row-2 {
      display: flex;
      gap: 8px
    }

    .row-2>* {
      flex: 1
    }

    button.primary {
      font: inherit;
      font-size: 13px;
      margin-top: 12px;
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      background: #378ADD;
      color: #fff;
      cursor: pointer
    }

    button.primary:disabled {
      opacity: .5;
      cursor: default
    }

    button.secondary {
      font: inherit;
      font-size: 13px;
      padding: 7px 14px;
      border: 0.5px solid #ccc;
      border-radius: 6px;
      background: none;
      color: inherit;
      cursor: pointer
    }

    .msg {
      font-size: 12px;
      margin-top: 10px
    }

    .msg-error {
      color: #C0392B
    }

    .msg-warn {
      color: #B9770E
    }

    .msg-ok {
      color: #1D9E75
    }

    .msg-info {
      color: #888
    }

    .preview {
      margin-top: 12px;
      padding: 12px;
      border: 0.5px solid #ccc;
      border-radius: 8px
    }

    @media(prefers-color-scheme:dark) {
      .preview {
        border-color: #444
      }
    }

    .preview h3 {
      font-size: 14px;
      font-weight: 500
    }

    .preview-meta {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px
    }

    .preview-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 2px 0
    }

    .preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px
    }
  </style>
</head>

<body>
  <div class="picker-row" id="picker-row" hidden>
    <label for="picker">Valg</label>
    <select id="picker"></select>
  </div>

  <h2 id="title"></h2>
  <p class="sub" id="subtitle"></p>

  <div id="party-list"></div>

  <div class="sticky-bar">
    <div class="progress-track">
      <div class="progress-fill" id="bar" style="width:0%;background:#888"></div>
    </div>
    <div class="stats">
      <span class="total-num" id="total">0</span>
      <span class="total-of" id="total-of"></span>
      <span class="verdict v-no" id="verdict"></span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
      <span class="footer-note" id="footer-note"></span>
      <button class="reset-btn" id="reset">Ryd alle</button>
    </div>
  </div>

  <details class="import">
    <summary>Importér et valg</summary>

    <form id="import-form" novalidate>
      <div class="field">
        <label for="f-url">Officiel resultatside (URL)</label>
        <input id="f-url" name="sourceUrl" type="url" placeholder="https://…" autocomplete="off">
        <div class="field-error" id="e-url"></div>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="f-nation">Land</label>
          <input id="f-nation" name="nation" type="text" autocomplete="off">
          <div class="field-error" id="e-nation"></div>
        </div>
        <div class="field">
          <label for="f-state">Region (valgfrit)</label>
          <input id="f-state" name="state" type="text" autocomplete="off">
          <div class="field-error"></div>
        </div>
      </div>
      <div class="field">
        <label for="f-date">Valgdato</label>
        <input id="f-date" name="electionDate" type="date">
        <div class="field-error" id="e-date"></div>
      </div>
      <button class="primary" id="f-submit" type="submit">Hent valgresultat</button>
    </form>

    <p class="msg" id="import-message"></p>

    <div class="preview" id="preview" hidden>
      <h3 id="preview-title"></h3>
      <div class="preview-meta" id="preview-meta"></div>
      <div id="preview-list"></div>
      <div class="preview-actions">
        <button class="primary" id="preview-confirm" type="button">Gem valget</button>
        <button class="secondary" id="preview-discard" type="button">Forkast</button>
      </div>
    </div>
  </details>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
